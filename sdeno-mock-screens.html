<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Vault — Jewelry Service POC Mock UI</title>
  <style>
    :root {
      --paper: #fafafa;
      --white: #ffffff;
      --black: #000000;
      --gray: #90908b;
      --navy: #1d3b5a;
      --silver: #b9bcc3;
      --border: rgba(185,188,195,.62);
      --border-soft: rgba(185,188,195,.35);
      --shadow: 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 20px 50px rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--black);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; font-size: 12px; }
    button { cursor: pointer; }

    .app { min-height: 100vh; background: var(--paper); }

    /* Mobile-first shell */
    .sidebar {
      position: static;
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 2px;
      background: var(--navy);
      color: var(--white);
      font-size: 17px;
    }

    .brand-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      letter-spacing: .02em;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--gray);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 12px 16px;
      scroll-snap-type: x proximity;
    }

    .nav-group {
      min-width: 205px;
      scroll-snap-align: start;
    }

    .nav-label {
      margin: 0 0 7px;
      padding: 0 2px;
      color: var(--gray);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: var(--gray);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      transition: background 140ms ease, color 140ms ease;
    }

    .nav-item:hover { background: var(--paper); color: var(--black); }
    .nav-item.active { background: var(--navy); color: var(--white); }

    .nav-icon {
      width: 17px;
      flex: 0 0 17px;
      text-align: center;
      font-size: 15px;
    }

    .main { min-height: 100vh; margin-left: 0; }

    .content { padding: 16px; }

    @media (max-width: 759px) {
      .brand { padding: 12px 14px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-title { font-size: 16px; }
      .brand-subtitle { font-size: 9px; letter-spacing: .16em; }
      .nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        overflow: visible;
        padding: 12px 14px;
      }
      .nav-group { min-width: 0; }
      .nav-item { padding: 8px; font-size: 12px; }
      .content { padding: 14px; }
      .dashboard-head { gap: 12px; }
      .dashboard-filters,
      .dashboard-actions,
      .filter-tabs,
      .filter-bar { gap: 8px; }
      .dashboard-actions .btn {
        flex: 1 1 calc(50% - 8px);
        min-width: 0;
      }
      .dashboard-filters .filter-control,
      .filter-bar .field-control,
      .filter-bar input.field-control,
      .filter-bar input.date-field {
        flex: 1 1 calc(50% - 8px);
        min-width: 0;
        max-width: none;
      }
      .filter-bar .btn { flex: 1 1 100%; }
      .filter-tab { font-size: 11px; padding: 6px 7px; }
      .metric-large { font-size: 20px; }
      .section-head,
      .new-service-header {
        align-items: flex-start;
      }
      .case-summary .section-head,
      .detail-section .section-head {
        display: grid;
      }
      .case-summary .compact-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .compact-actions .btn { min-height: 32px; font-size: 12px; }
      .btn { padding: 0 10px; }
      .summary-grid { gap: 0; }
      .summary-item { padding: 9px 0; }
      .table-actions { flex-wrap: wrap; }
      table { min-width: 780px; }
      .calendar-grid { overflow-x: auto; }
      .calendar-day-name,
      .calendar-cell { min-width: 96px; }
      .calendar-cell { min-height: 96px; padding: 8px; }
    }

    .page { animation: fadeUp 160ms ease-out; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-header {
      display: block;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--gray);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--black);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .page-desc {
      max-width: 580px;
      margin: 6px 0 0;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.65;
    }

    .page-header-action { margin-top: 14px; }

    .btn {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(185,188,195,.75);
      border-radius: 2px;
      background: var(--white);
      color: var(--black);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 550;
      text-decoration: none;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .btn:hover { border-color: var(--navy); }
    .btn-primary { border-color: var(--navy); background: var(--navy); color: var(--white); }
    .btn-primary:hover { border-color: var(--black); background: var(--black); }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--gray); }
    .btn-sm { min-height: 28px; padding: 0 8px; font-size: 11px; }

    .grid { display: grid; gap: 14px; }
    .grid-6, .grid-4, .grid-3, .grid-2, .grid-12, .workflow-grid, .receipt-grid, .detail-grid, .photo-grid {
      grid-template-columns: 1fr;
    }

    .mt-5 { margin-top: 20px; }
    .mt-6 { margin-top: 24px; }

    .card {
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .card.dark {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
    }

    .card-body, .metric-body { padding: 14px; }

    .metric-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .icon-box {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(185,188,195,.42);
      border-radius: 2px;
      background: var(--paper);
      font-size: 15px;
    }

    .dark .icon-box {
      border-color: transparent;
      background: rgba(255,255,255,.1);
    }

    .muted { color: var(--gray); }
    .dark .muted { color: var(--silver); }

    .metric-label { font-size: 12px; opacity: .75; }
    .metric-value { margin-top: 4px; font-size: 24px; font-weight: 650; letter-spacing: -.03em; }
    .metric-sub { margin-top: 6px; font-size: 11px; opacity: .72; }

    .section-title {
      margin: 0;
      color: var(--black);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 500;
    }

    .section-sub {
      margin: 3px 0 0;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.55;
    }

    .workflow-grid {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .workflow-card {
      border: 1px solid;
      border-radius: 2px;
      padding: 12px;
    }

    .workflow-card .count {
      margin-top: 16px;
      font-size: 23px;
      font-weight: 700;
    }

    .workflow-card .label { font-size: 12px; }

    .bg-pending { background: #fffbeb; border-color: #fde68a; color: #b45309; }
    .bg-workshop { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .bg-ready { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .bg-overdue { background: #fff1f2; border-color: #fecdd3; color: #be123c; }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(185,188,195,.5);
      border-radius: 2px;
      background: var(--white);
      padding: 12px 14px;
    }

    .list-title {
      color: var(--black);
      font-size: 14px;
      font-weight: 650;
    }

    .list-sub {
      margin-top: 2px;
      color: var(--gray);
      font-size: 12px;
    }

    .quick-actions {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .quick-action {
      display: flex;
      width: 100%;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid rgba(185,188,195,.5);
      border-radius: 2px;
      background: var(--paper);
      padding: 12px;
      text-align: left;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .quick-action:hover { border-color: var(--navy); background: var(--white); }

    .quick-action-icon {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 2px;
      background: var(--navy);
      color: var(--white);
    }

    .quick-title { display: block; font-size: 14px; font-weight: 700; }
    .quick-desc { display: block; margin-top: 2px; color: var(--gray); font-size: 12px; line-height: 1.55; }

    .route-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .new-service-shell {
      display: grid;
      gap: 18px;
    }

    .new-service-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: var(--black);
      padding: 0;
      font-size: 14px;
      font-weight: 650;
    }

    .back-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      color: var(--gray);
    }

    .intake-layout {
      display: grid;
      gap: 18px;
    }

    .intake-main,
    .intake-side {
      display: grid;
      align-content: start;
      gap: 18px;
    }

    .intake-card {
      border: 1px solid rgba(185,188,195,.62);
      border-radius: 2px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .intake-card-body { padding: 18px; }

    .intake-card-title {
      margin: 0;
      color: var(--black);
      font-size: 16px;
      font-weight: 750;
    }

    .intake-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .intake-row .field-label { flex: 1 1 220px; }

    .icon-button {
      display: grid;
      min-width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--navy);
      border-radius: 2px;
      background: var(--navy);
      color: var(--white);
      padding: 0 12px;
      font-size: 15px;
      font-weight: 700;
    }

    .photo-requirement {
      margin-top: 10px;
      color: #b45309;
      font-size: 12px;
    }

    .service-line {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      border-top: 1px solid var(--border-soft);
      padding-top: 18px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .service-pill {
      border: 1px solid rgba(185,188,195,.75);
      border-radius: 2px;
      background: var(--white);
      color: var(--black);
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1;
    }

    .service-pill.active {
      border-color: var(--navy);
      background: #f8fafc;
      color: var(--navy);
      font-weight: 700;
    }

    .side-stack {
      display: grid;
      gap: 14px;
    }

    .summary-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--border-soft);
      margin-top: 12px;
      padding-top: 12px;
      color: var(--black);
      font-size: 14px;
      font-weight: 750;
    }

    .payment-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.5;
    }

    .payment-row strong {
      color: var(--black);
      font-weight: 750;
    }

    .paid-text { color: #047857; }

    .balance-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #fef3c7;
      color: #b45309;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .segmented {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .segment {
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: var(--gray);
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .segment.active {
      background: var(--black);
      color: var(--white);
    }

    .full-width-btn {
      width: 100%;
      margin-top: 14px;
    }

    .dashboard-head {
      display: grid;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 20px;
    }

    .dashboard-filters,
    .dashboard-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .dashboard-filters .filter-control { min-width: 118px; }

    .filter-control {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      color: var(--gray);
      padding: 0 10px;
      font-size: 12px;
      box-shadow: var(--shadow);
    }

    .metric-large {
      margin-top: 10px;
      color: var(--black);
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.02em;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .metric-note {
      margin-top: 6px;
      color: var(--gray);
      font-size: 11px;
    }

    .channel-grid {
      display: grid;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      background: var(--white);
    }

    .channel-cell {
      border-bottom: 1px solid var(--border-soft);
      padding: 14px;
    }

    .channel-cell:last-child { border-bottom: 0; }

    .amount-green { color: #047857; }
    .amount-red { color: #dc2626; }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .filter-tab {
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: var(--gray);
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .filter-tab.active {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .filter-bar .field-control {
      width: auto;
      min-width: 150px;
      min-height: 32px;
      margin-top: 0;
    }

    .filter-bar input.field-control { max-width: 240px; }
    .filter-bar input.date-field { max-width: 130px; }
    .filter-bar input::placeholder { color: var(--gray); font-size: 11px; }
    .filter-bar .muted { font-size: 11px; }
    .dashboard-actions .btn { font-size: 12px; }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 16px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
    }

    .calendar-day-name {
      border-bottom: 1px solid var(--border);
      padding: 10px;
      color: var(--gray);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
    }

    .calendar-cell {
      min-height: 112px;
      border-right: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px;
      color: var(--gray);
      font-size: 12px;
    }

    .calendar-cell:nth-child(7n) { border-right: 0; }
    .calendar-date.active { display:inline-grid; width:28px; height:28px; place-items:center; border-radius:50%; background: var(--black); color: var(--white); }

    .pickup-pill {
      display: inline-flex;
      margin-top: 12px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .calendar-cell.has-pickups { cursor: pointer; }
    .calendar-cell.has-pickups:hover { background: #f8fafc; }

    .day-cases {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.32);
      padding: 20px;
    }

    .day-cases.show { display: flex; }

    .day-cases-card {
      width: min(100%, 520px);
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      box-shadow: var(--shadow-lg);
      padding: 20px;
    }

    .flow-rail {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .flow-step {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      border: 1px solid rgba(185,188,195,.5);
      border-radius: 2px;
      background: var(--white);
      padding: 12px;
    }

    .flow-step.done { border-color: rgba(29,59,90,.45); background: #f8fafc; }
    .flow-step.current { border-color: var(--navy); box-shadow: inset 3px 0 0 var(--navy); }

    .step-index {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
    }

    .flow-title { color: var(--black); font-size: 13px; font-weight: 700; }
    .flow-desc { margin-top: 3px; color: var(--gray); font-size: 12px; line-height: 1.5; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .tab {
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      color: var(--gray);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 650;
    }

    .tab.active {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
    }

    .field-control {
      width: 100%;
      min-height: 36px;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      color: var(--black);
      padding: 7px 9px;
      outline: none;
      font-size: 12px;
    }

    .field-control::placeholder { color: var(--gray); font-size: 11px; }

    textarea.field-control { min-height: 72px; resize: vertical; }

    .generated-box {
      display: flex;
      min-height: 36px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 4px;
      border: 1px solid rgba(29,59,90,.36);
      border-radius: 2px;
      background: #f8fafc;
      padding: 7px 9px;
      color: var(--black);
      font-size: 12px;
      font-weight: 700;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .upload-tile,
    .attachment-tile {
      display: grid;
      min-height: 86px;
      place-items: center;
      border: 1px dashed rgba(29,59,90,.42);
      border-radius: 2px;
      background: var(--paper);

      if (s.includes("sent")) return "status-sent";
      if (s.includes("draft")) return "status-draft";
      if (s === "high") return "status-high";
      if (s === "normal") return "status-normal";
      if (s === "low") return "status-low";
      return "status-draft";
    }

    }

    function openPickupDay(day) {
      const cases = pickupCaseMap[day] || [];
      document.getElementById("pickupDayContent").innerHTML = `
        <div class="section-head">
          <div>
            <h2 class="section-title">May ${day}, 2026</h2>
            <p class="section-sub">${cases.length} mapped service cases</p>
          </div>
          <button class="btn btn-ghost" onclick="closePickupDay()">✕</button>
        </div>
        <div class="list">
          ${cases.map(([index, itemCount, state, payment]) => {
            const row = serviceCases[index] || serviceCases[0];
            return `
              <div class="list-row" onclick="navigateServiceDetail(${index})" style="cursor:pointer;">
                <div>
                  <div class="list-sub">${row.id} · ${itemCount}</div>
                  <div class="list-title">${row.customer}</div>
                </div>
                <div style="text-align:right;">
                  ${status(state)}
                  <div class="list-sub">${payment}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
      document.getElementById("pickupDayOverlay").classList.add("show");
    }

    function closePickupDay(event) {
      if (event && event.target.id !== "pickupDayOverlay") return;
      const overlay = document.getElementById("pickupDayOverlay");
      if (overlay) overlay.classList.remove("show");
    }

    function renderApprovals() {
      const states = ["Sent", "Pending", "Approved", "Draft"];
      return `
        <section class="page">
          ${pageHeader("Service Operations", "Customer approvals", "Approval requests, resend controls, customer responses, and approval state before workshop proceeds.")}
          <div class="grid grid-3">
            <div class="approval-panel">
              <div class="eyebrow">Portal Approval</div>
              <div class="info-value">SRV-01942 · ${serviceCases[0].estimate}</div>
              <p class="section-sub">Customer can approve, decline, or ask a question from the status link.</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary">Approve</button><button class="btn">Decline</button><button class="btn">Ask Question</button></div>
            </div>
            <div class="info-box">
              <div class="info-label">Approval before workshop</div>
              <div class="info-value">Required for estimate changes</div>
              <p class="section-sub">Approval event is stored on the service case and visible in activity history.</p>
            </div>
            <div class="info-box">
              <div class="info-label">Resend controls</div>
              <div class="info-value">SMS + email templates</div>
              <p class="section-sub">Staff can resend the same status link without creating a duplicate thread.</p>
            </div>
          </div>
          <div class="card table-scroll mt-5">
            <table>
              <thead><tr><th>Service ID</th><th>Customer</th><th>Item</th><th>Work Description</th><th>Estimate</th><th>Approval Status</th><th>Sent Date</th><th>Last Response</th><th>Actions</th></tr></thead>
              <tbody>
                ${serviceCases.slice(0, 4).map((x, i) => `
                  <tr>
                    <td class="primary">${x.id}</td><td>${x.customer}</td><td>${x.item}</td><td class="truncate">${x.description}</td><td class="primary">${x.estimate}</td><td>${status(states[i])}</td><td>${i === 3 ? "Not sent" : "May 20"}</td><td>${i === 2 ? "Approved by SMS" : i === 0 ? "Customer asked one question" : "No response"}</td><td>Open Thread</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderCustomers() {
      return tablePage(
        "Engagement",
        "Customers",
        "Customer directory connected to active cases, service history, communication logs, and item history.",
        ["Customer Name", "Phone", "Email", "Active Cases", "Last Service Date", "Membership / Type", "Actions"],
        customers.map(x => [x.name, x.phone, x.email, x.active, x.last, x.type, "View History"])
      );
    }

    function renderMessages() {
      return `
        <section class="page">
          ${pageHeader("Engagement", "Messages", "Service-linked SMS/email threads, internal notes, approval messages, automated notifications, and attachments.")}
          <div class="grid grid-2">
            <div class="card">
              <div class="card-body">
                <h2 class="section-title">Notification automation</h2>
                <p class="section-sub">Mock evidence that customer messages are tied to service status changes.</p>
                <div class="list">
                  ${notificationEvents.map(([channel, title, state, time]) => `
                    <div class="list-row">
                      <div>
                        <div class="list-title">${channel} · ${title}</div>
                        <div class="list-sub">${time}</div>
                      </div>
                      ${status(state)}
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
            <div class="card">
              <div class="card-body">
                <h2 class="section-title">Service chat thread</h2>
                <p class="section-sub">Portal chat keeps approval context on the same service job.</p>
                ${renderChatThread()}
              </div>
            </div>
          </div>
          <div class="card table-scroll mt-5">
            <table>
              <thead><tr><th>Customer</th><th>Service ID</th><th>Channel</th><th>Last Message</th><th>Status</th><th>Last Updated</th></tr></thead>
              <tbody>
                ${serviceCases.slice(0, 4).map((x, i) => `
                  <tr><td class="primary">${x.customer}</td><td>${x.id}</td><td>${i % 2 ? "Email" : "SMS"}</td><td>${i === 0 ? "Photo update and portal approval sent" : i === 1 ? "Approval request pending" : "Pickup reminder sent"}</td><td>${i === 1 ? status("Pending") : status("Sent")}</td><td>${x.updated}</td></tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderPortal() {
      const row = serviceCases[0];
      return `
        <section class="page">
          ${pageHeader("Engagement", "Customer portal preview", "Customer-facing status page from the QR/status link, focused on the next customer action, repair progress, photos, and service conversation.")}
          <div class="card portal-card">
            <div class="card-body">
              <div class="portal-head">
                <div>
                  <div class="secondary" style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px;">${row.id}</div>
                  <h2 class="portal-title">${row.item}</h2>
                  <p class="section-sub">For ${row.customer}</p>
                </div>
                ${status(row.status)}
              </div>

              <div class="portal-action-band">
                <div class="section-head" style="margin-bottom:0;">
                  <div>
                    <div class="eyebrow">Next Step</div>
                    <div class="info-value">${row.estimate} estimate ready for approval</div>
                    <p class="section-sub">Stone tightening and claw inspection. Approval lets the workshop continue without another phone call.</p>
                  </div>
                  <div class="compact-actions">
                    <button class="btn btn-primary">Approve Estimate</button>
                    <button class="btn">Ask Question</button>
                  </div>
                </div>
                <div class="portal-progress">
                  <div class="progress-segment done"></div>
                  <div class="progress-segment done"></div>
                  <div class="progress-segment done"></div>
                  <div class="progress-segment"></div>
                  <div class="progress-segment"></div>
                </div>
              </div>

              <div class="portal-layout">
                <div class="portal-main">
                  <div class="info-box">
                    <div class="section-head">
                      <div>
                        <div class="info-value">Service details</div>
                        <p class="section-sub">Customer-visible information from the service record.</p>
                      </div>
                    </div>
                    <div class="summary-grid">
                      <div class="summary-item"><div class="summary-k">Estimated completion</div><div class="summary-v">${row.due}</div></div>
                      <div class="summary-item"><div class="summary-k">Current status</div><div class="summary-v">In progress</div></div>
                      <div class="summary-item"><div class="summary-k">Messages</div><div class="summary-v">2 updates</div></div>
                      <div class="summary-item"><div class="summary-k">Service request</div><div class="summary-v">${row.description}</div></div>
                      <div class="summary-item"><div class="summary-k">Receipt</div><div class="summary-v">Digital copy available</div></div>
                      <div class="summary-item"><div class="summary-k">Pickup notice</div><div class="summary-v">SMS when ready</div></div>
                    </div>
                  </div>

                  <div class="info-box">
                    <div class="section-head">
                      <div>
                        <div class="info-value">Photos</div>
                        <p class="section-sub">Before and inspection photos connected to ${row.id}.</p>
                      </div>
                    </div>
                    <div class="photo-grid">
                      <div class="photo-placeholder filled">Before photo<br><span class="muted">ring-before-01942.jpg</span></div>
                      <div class="photo-placeholder filled">Stone setting<br><span class="muted">claw-detail-01942.jpg</span></div>
                      <div class="photo-placeholder filled">Receipt QR<br><span class="muted">srv-01942-link.png</span></div>
                    </div>
                  </div>

                  <div class="info-box">
                    <div class="info-value">Portal conversation</div>
                    ${renderChatThread()}
                  </div>
                </div>

                <div class="portal-side">
                  <div class="info-box">
                    <div class="info-value">Service timeline</div>
                    ${renderStatusTimeline()}
                  </div>
                  <div class="info-box">
                    <div class="info-value">Notifications</div>
                    <div class="receipt-strip">
                      <div class="receipt-chip"><span>Status link</span><strong>Sent</strong></div>
                      <div class="receipt-chip"><span>Receipt email</span><strong>Sent</strong></div>
                      <div class="receipt-chip"><span>Pickup SMS</span><strong>Queued</strong></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderReceipts() {
      const lines = ["Service ID", "Customer Details", "Item Description", "Service Request", "Workshop Message", "Warranty / Guarantee", "Price Estimate", "QR / Status Link", "Terms / Signature"];
      return `
        <section class="page">
          ${pageHeader("Documents", "Receipt preview", "Printable service receipt mapped to store, customer, workshop, and internal copies.")}
          <div class="receipt-grid">
            ${["Store Copy", "Customer Copy", "Workshop Copy", "Internal Copy"].map(copy => `
              <div class="card">
                <div class="card-body">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                    <h2 class="section-title" style="font-size:18px;">${copy}</h2>
                    <span class="muted">□</span>
                  </div>
                  ${lines.map(line => `<div class="receipt-line">${line}</div>`).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderReports() {
      const cards = [
        ["Cases by Status", "42 active cases"], ["Overdue Cases", "4 require action"],
        ["Pending Approval", "9 waiting customer"], ["Ready for Pickup", "11 notified"],
        ["Avg. Turnaround", "6.4 days"], ["Workshop Load", "78% capacity"],
        ["Completed Cases", "64 this month"], ["Estimated Revenue", "$38,420"]
      ];
      return `
        <section class="page">
          ${pageHeader("Insights", "Reports", "Operational reporting for management visibility across cases, approvals, workshop load, turnaround, and revenue.")}
          <div class="grid grid-4">
            ${cards.map(([a,b]) => metric("▥", a, b, "Service POC metric")).join("")}
          </div>
        </section>
      `;
    }

    function renderSettings() {
      const sections = ["Service Statuses", "Service Categories", "Notification Templates", "Receipt Template", "Staff / Workshop Users", "Customer Portal Settings", "HubSpot Integration", "SMS / Email Settings"];
      return tablePage(
        "Admin",
        "Settings",
        "Administrative setup for workflow, templates, users, customer portal, and integrations.",
        ["Section", "Purpose", "Status"],
        sections.map(x => [x, "Configuration area", status("Draft")])
      );
    }

    function renderProducts() {
      return tablePage(
        "Admin",
        "Products",
        "Global product catalog for SDE item types and sellable product references. This is not inventory stock tracking.",
        ["Product", "Category", "Default Handling", "Catalog Status", "Actions"],
        [
          ["Vintage Cartier Ring", "Ring", "Photo + hallmark required", status("Approved"), "Edit"],
          ["Rolex Datejust", "Watch", "Serial and pressure-test notes", status("Approved"), "Edit"],
          ["Diamond Pendant", "Pendant", "Stone notes required", status("Draft"), "Edit"],
          ["Pearl Necklace", "Necklace", "Stringing service compatible", status("Approved"), "Edit"],
        ]
      );
    }

    function renderServicesList() {
      return tablePage(
        "Admin",
        "Services",
        "Global service catalog used during intake, estimates, approvals, receipts, and workshop instructions.",
        ["Service", "Category", "Default Price", "Approval Required", "Status"],
        [
          ["Claw tightening", "Jewelry repair", "$1,200", "Yes", status("Approved")],
          ["Watch polish", "Watch service", "$450", "No", status("Approved")],
          ["Pressure test", "Watch service", "$320", "No", status("Approved")],
          ["Pearl restringing", "Jewelry repair", "$260", "No", status("Draft")],
        ]
      );
    }

    function renderPage() {
      const pages = {
        dashboard: renderDashboard,
        service: renderServiceCases,
        "service-new": renderNewService,
        "service-detail": renderServiceDetail,
        workshop: renderWorkshop,
        pickups: renderPickupCalendar,
        approvals: renderApprovals,
        customers: renderCustomers,
        messages: renderMessages,
        portal: renderPortal,
        receipts: renderReceipts,
        reports: renderReports,
        products: renderProducts,
        "services-list": renderServicesList,
        settings: renderSettings,
      };
      document.getElementById("content").innerHTML = (pages[active] || renderDashboard)();
    }

    if (window.location.hash === "#/service/new") {
      active = "service-new";
    } else if (window.location.hash.startsWith("#/service/")) {
      const serviceId = window.location.hash.replace("#/service/", "");
      const matchedIndex = serviceCases.findIndex(row => row.id === serviceId);
      if (matchedIndex >= 0) {
        activeServiceIndex = matchedIndex;
        active = "service-detail";
      }
    }

    renderNav();
    renderPage();
  </script>
</body>
</html>
