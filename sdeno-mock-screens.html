<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Vault — Jewelry Service POC Mock UI</title>
  <style>
    :root {
      --paper: #fafafa;
      --white: #ffffff;
      --black: #000000;
      --gray: #90908b;
      --navy: #1d3b5a;
      --silver: #b9bcc3;
      --border: rgba(185,188,195,.62);
      --border-soft: rgba(185,188,195,.35);
      --shadow: 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 20px 50px rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--black);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; font-size: 12px; }
    button { cursor: pointer; }

    .app { min-height: 100vh; background: var(--paper); }

    /* Mobile-first shell */
    .sidebar {
      position: static;
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 2px;
      background: var(--navy);
      color: var(--white);
      font-size: 17px;
    }

    .brand-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      letter-spacing: .02em;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--gray);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 12px 16px;
      scroll-snap-type: x proximity;
    }

    .nav-group {
      min-width: 205px;
      scroll-snap-align: start;
    }

    .nav-label {
      margin: 0 0 7px;
      padding: 0 2px;
      color: var(--gray);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: var(--gray);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      transition: background 140ms ease, color 140ms ease;
    }

    .nav-item:hover { background: var(--paper); color: var(--black); }
    .nav-item.active { background: var(--navy); color: var(--white); }

    .nav-icon {
      width: 17px;
      flex: 0 0 17px;
      text-align: center;
      font-size: 15px;
    }

    .main { min-height: 100vh; margin-left: 0; }

    .content { padding: 16px; }

    @media (max-width: 759px) {
      .brand { padding: 12px 14px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-title { font-size: 16px; }
      .brand-subtitle { font-size: 9px; letter-spacing: .16em; }
      .nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        overflow: visible;
        padding: 12px 14px;
      }
      .nav-group { min-width: 0; }
      .nav-item { padding: 8px; font-size: 12px; }
      .content { padding: 14px; }
      .dashboard-head { gap: 12px; }
      .dashboard-filters,
      .dashboard-actions,
      .filter-tabs,
      .filter-bar { gap: 8px; }
      .dashboard-actions .btn {
        flex: 1 1 calc(50% - 8px);
        min-width: 0;
      }
      .dashboard-filters .filter-control,
      .filter-bar .field-control,
      .filter-bar input.field-control,
      .filter-bar input.date-field {
        flex: 1 1 calc(50% - 8px);
        min-width: 0;
        max-width: none;
      }
      .filter-bar .btn { flex: 1 1 100%; }
      .filter-tab { font-size: 11px; padding: 6px 7px; }
      .metric-large { font-size: 20px; }
      .section-head,
      .new-service-header {
        align-items: flex-start;
      }
      .case-summary .section-head,
      .detail-section .section-head {
        display: grid;
      }
      .case-summary .compact-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .compact-actions .btn { min-height: 32px; font-size: 12px; }
      .btn { padding: 0 10px; }
      .summary-grid { gap: 0; }
      .summary-item { padding: 9px 0; }
      .table-actions { flex-wrap: wrap; }
      table { min-width: 780px; }
      .calendar-grid { overflow-x: auto; }
      .calendar-day-name,
      .calendar-cell { min-width: 96px; }
      .calendar-cell { min-height: 96px; padding: 8px; }
    }

    .page { animation: fadeUp 160ms ease-out; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-header {
      display: block;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--gray);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--black);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .page-desc {
      max-width: 580px;
      margin: 6px 0 0;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.65;
    }

    .page-header-action { margin-top: 14px; }

    .btn {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(185,188,195,.75);
      border-radius: 2px;
      background: var(--white);
      color: var(--black);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 550;
      text-decoration: none;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .btn:hover { border-color: var(--navy); }
    .btn-primary { border-color: var(--navy); background: var(--navy); color: var(--white); }
    .btn-primary:hover { border-color: var(--black); background: var(--black); }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--gray); }
    .btn-sm { min-height: 28px; padding: 0 8px; font-size: 11px; }

    .grid { display: grid; gap: 14px; }
    .grid-6, .grid-4, .grid-3, .grid-2, .grid-12, .workflow-grid, .receipt-grid, .detail-grid, .photo-grid {
      grid-template-columns: 1fr;
    }

    .mt-5 { margin-top: 20px; }
    .mt-6 { margin-top: 24px; }

    .card {
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .card.dark {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
    }

    .card-body, .metric-body { padding: 14px; }

    .metric-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .icon-box {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(185,188,195,.42);
      border-radius: 2px;
      background: var(--paper);
      font-size: 15px;
    }

    .dark .icon-box {
      border-color: transparent;
      background: rgba(255,255,255,.1);
    }

    .muted { color: var(--gray); }
    .dark .muted { color: var(--silver); }

    .metric-label { font-size: 12px; opacity: .75; }
    .metric-value { margin-top: 4px; font-size: 24px; font-weight: 650; letter-spacing: -.03em; }
    .metric-sub { margin-top: 6px; font-size: 11px; opacity: .72; }

    .section-title {
      margin: 0;
      color: var(--black);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 500;
    }

    .section-sub {
      margin: 3px 0 0;
      color: var(--gray);
      font-size: 12px;
      line-height: 1.55;
    }

    .workflow-grid {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .workflow-card {
      border: 1px solid;
      border-radius: 2px;
      padding: 12px;
    }

    .workflow-card .count {
      margin-top: 16px;
      font-size: 23px;
      font-weight: 700;
    }

    .workflow-card .label { font-size: 12px; }

    .bg-pending { background: #fffbeb; border-color: #fde68a; color: #b45309; }
    .bg-workshop { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .bg-ready { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .bg-overdue { background: #fff1f2; border-color: #fecdd3; color: #be123c; }

    .kanban-board {
      display: flex;
      gap: 10px;
      align-items: start;
      overflow-x: auto;
      min-height: calc(100vh - 330px);
      padding: 2px 2px 12px;
      scroll-snap-type: x proximity;
    }

    .kanban-column {
      flex: 0 0 248px;
      min-width: 248px;
      max-width: 248px;
      min-height: calc(100vh - 348px);
      border: 1px solid var(--border);
      border-radius: 2px;
      background: rgba(255,255,255,.74);
      scroll-snap-align: start;
    }

    .kanban-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border-soft);
      border-top: 4px solid var(--silver);
      padding: 10px 12px;
    }

    .kanban-title {
      color: var(--black);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.25;
    }

    .kanban-count {
      display: inline-flex;
      min-width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      background: var(--paper);
      color: var(--gray);
      font-size: 12px;
      font-weight: 750;
    }

    .kanban-list {
      display: grid;
      gap: 8px;
      padding: 10px;
    }

    .kanban-card {
      border: 1px solid rgba(185,188,195,.6);
      border-radius: 2px;
      background: var(--white);
      padding: 10px;
      text-align: left;
      transition: border-color 140ms ease, transform 140ms ease;
    }

    .kanban-card:hover {
      border-color: var(--navy);
      transform: translateY(-1px);
    }

    .kanban-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--gray);
      font-size: 10px;
    }

    .kanban-card-title {
      margin-top: 6px;
      color: var(--black);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
    }

    .kanban-card-sub {
      margin-top: 3px;
      color: var(--gray);
      font-size: 11px;
      line-height: 1.45;
    }

    .kanban-card-brand {
      margin-top: 6px;
      color: var(--gray);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .kanban-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .kanban-card-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    .kanban-received .kanban-head { border-top-color: #93a4bd; }
    .kanban-approval .kanban-head { border-top-color: #d97706; }
    .kanban-progress .kanban-head { border-top-color: #2563eb; }
    .kanban-ready .kanban-head { border-top-color: #059669; }
    .kanban-completed .kanban-head { border-top-color: #64748b; }
    .kanban-overdue .kanban-head { border-top-color: #dc2626; }

    .service-hero {
      display: grid;
      gap: 18px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .service-hero-main {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .service-avatar {
      display: grid;
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 2px;
      background: var(--navy);
      color: var(--white);
      font-size: 22px;
      font-weight: 800;
    }

    .service-hero-title {
      margin: 3px 0 0;
      color: var(--black);
      font-size: 26px;
      line-height: 1.18;
      font-weight: 760;
      letter-spacing: -.02em;
    }

    .service-hero-sub {
      margin-top: 6px;
      color: var(--gray);
      font-size: 14px;
    }

    .service-hero-side {
      display: grid;
      justify-items: end;
      gap: 10px;
      margin-left: auto;
    }

    .service-stage {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .stage-step {
      display: grid;
      gap: 6px;
      color: var(--gray);
      font-size: 12px;
      min-width: 0;
    }

    .stage-line {
      height: 3px;
      border-radius: 999px;
      background: var(--border-soft);
    }

    .stage-step.done .stage-line,
    .stage-step.active .stage-line {
      background: var(--navy);
    }

    .stage-step.active {
      color: var(--navy);
      font-weight: 750;
    }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(185,188,195,.5);
      border-radius: 2px;
      background: var(--white);
      padding: 12px 14px;
    }

    .list-title {
      color: var(--black);
      font-size: 14px;
      font-weight: 650;
    }

    .list-sub {
      margin-top: 2px;
      color: var(--gray);
      font-size: 12px;
    }

    .quick-actions {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .quick-action {
      display: flex;
      width: 100%;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid rgba(185,188,195,.5);
      border-radius: 2px;
      background: var(--paper);
      padding: 12px;
      text-align: left;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .quick-action:hover { border-color: var(--navy); background: var(--white); }

    .quick-action-icon {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 2px;
      background: var(--navy);
      color: var(--white);
    }

    .quick-title { display: block; font-size: 14px; font-weight: 700; }
    .quick-desc { display: block; margin-top: 2px; color: var(--gray); font-size: 12px; line-height: 1.55; }

    .route-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .new-service-shell {
      display: grid;
      gap: 18px;
    }

    .new-service-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: var(--black);
      padding: 0;
      font-size: 14px;
      font-weight: 650;
    }

    .back-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      color: var(--gray);
    }

    .intake-layout {
      display: grid;
      gap: 18px;
    }

    .intake-main,
    .intake-side {
      display: grid;
      align-content: start;
      gap: 18px;
    }

    .intake-card {
      border: 1px solid rgba(185,188,195,.62);
      border-radius: 2px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .intake-card-body { padding: 18px; }

    .intake-card-title {
      margin: 0;
      color: var(--black);
      font-size: 16px;
      font-weight: 750;
    }

    .intake-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .intake-row .field-label { flex: 1 1 220px; }

    .icon-button {
      display: grid;
      min-width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--navy);
      border-radius: 2px;
      background: var(--navy);
      color: var(--white);
      padding: 0 12px;
      font-size: 15px;
      font-weight: 700;
    }

    .photo-requirement {
      margin-top: 10px;
      color: #b45309;
      font-size: 12px;
    }

    .service-line {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      border-top: 1px solid var(--border-soft);
      padding-top: 18px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .service-pill {
      border: 1px solid rgba(185,188,195,.75);
      border-radius: 2px;
      background: var(--white);
      color: var(--black);
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1;
    }

    .service-pill.active {
      border-color: var(--navy);
      background: #f8fafc;
      color: var(--navy);
      font-weight: 700;
    }

    .side-stack {
      display: grid;
      gap: 14px;
    }

    .summary-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--border-soft);
      margin-top: 12px;
      padding-top: 12px;
      color: var(--black);
      font-size: 14px;
      font-weight: 750;
    }

    .workflow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.5;
    }

    .workflow-row strong {
      color: var(--black);
      font-weight: 750;
    }

    .action-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #fef3c7;
      color: #b45309;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .segmented {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .segment {
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: var(--gray);
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .segment.active {
      background: var(--black);
      color: var(--white);
    }

    .full-width-btn {
      width: 100%;
      margin-top: 14px;
    }

    .dashboard-head {
      display: grid;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 20px;
    }

    .dashboard-filters,
    .dashboard-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .dashboard-filters .filter-control { min-width: 118px; }

    .filter-control {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--white);
      color: var(--gray);
      padding: 0 10px;
      font-size: 12px;
      box-shadow: var(--shadow);
    }

    .metric-large {
      margin-top: 10px;
      color: var(--black);
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.02em;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .metric-note {
      margin-top: 6px;
      color: var(--gray);
      font-size: 11px;
    }

    .channel-grid {
      display: grid;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      background: var(--white);
    }

    .channel-cell {
      border-bottom: 1px solid var(--border-soft);
      padding: 14px;
    }

    .channel-cell:last-child { border-bottom: 0; }

    .amount-green { color: #047857; }
    .amount-red { color: #dc2626; }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .filter-tab {
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: var(--gray);
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .filter-tab.active {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .filter-bar .field-control {
      width: auto;
      min-width: 150px;
      min-height: 32px;
      margin-top: 0;
    }

    .filter-bar input.field-control { max-width: 240px; }

          ["Claw tightening", "Jewelry repair", "Inspection + tightening", "Yes", status("Approved")],
          ["Watch polish", "Watch service", "Polish + inspection", "No", status("Approved")],
          ["Pressure test", "Watch service", "Pressure test report", "No", status("Approved")],
          ["Pearl restringing", "Jewelry repair", "Restring + clasp check", "No", status("Draft")],
        ]
      );
    }

    function renderPage() {
      const pages = {
        dashboard: renderDashboard,
        service: renderServiceCases,
        "service-new": renderNewService,
        "service-detail": renderServiceDetail,
        workshop: renderWorkshop,
        "workshop-detail": renderWorkshopDetail,
        pickups: renderPickupCalendar,
        approvals: renderApprovals,
        "approval-detail": renderApprovalDetail,
        customers: renderCustomers,
        portal: renderPortal,
        receipts: renderReceipts,
        reports: renderReports,
        products: renderProducts,
        "services-list": renderServicesList,
        settings: renderSettings,
      };
      document.getElementById("content").innerHTML = (pages[active] || renderDashboard)();
    }

    if (window.location.hash === "#/service/new") {
      active = "service-new";
    } else if (window.location.hash.startsWith("#/service/")) {
      const serviceId = window.location.hash.replace("#/service/", "");
      const matchedIndex = serviceCases.findIndex(row => row.id === serviceId);
      if (matchedIndex >= 0) {
        activeServiceIndex = matchedIndex;
        active = "service-detail";
      }
    } else if (window.location.hash.startsWith("#/workshop/")) {
      const serviceId = window.location.hash.replace("#/workshop/", "");
      const matchedIndex = serviceCases.findIndex(row => row.id === serviceId);
      if (matchedIndex >= 0) {
        activeServiceIndex = matchedIndex;
        active = "workshop-detail";
      }
    } else if (window.location.hash.startsWith("#/approvals/")) {
      const serviceId = window.location.hash.replace("#/approvals/", "");
      const matchedIndex = serviceCases.findIndex(row => row.id === serviceId);
      if (matchedIndex >= 0) {
        activeServiceIndex = matchedIndex;
        active = "approval-detail";
      }
    }

    renderNav();
    renderPage();
  </script>
</body>
</html>
